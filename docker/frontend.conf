location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}
location /api/ {
    set $api_backend api:5400;
    proxy_pass http://$api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 35s;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
}
# Independent remotes also serve their own prefixed assets on their published port.
location ~ ^/remotes/(portal|auth|competition|player|admin)/(.*)$ {
    rewrite ^/remotes/[^/]+/(.*)$ /$1 last;
}
location = /runtime-config.json { try_files $uri =404; }
location = /remoteEntry.js { try_files $uri =404; }
location = /mf-manifest.json { try_files $uri =404; }
location = /mf-stats.json { try_files $uri =404; }
location /assets/ { try_files $uri =404; }
location ~ \.(js|css|json|png|jpe?g|svg|webp|ico|woff2?)$ { try_files $uri =404; }
location / { try_files $uri $uri/ /index.html; }
