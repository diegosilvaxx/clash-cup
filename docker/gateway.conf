# DNS is resolved per request so the shell starts and stays available without a remote.
location ^~ /remotes/portal/ {
    set $remote_backend portal:8080;
    proxy_pass http://$remote_backend;
    proxy_hide_header Cache-Control;
    proxy_hide_header Access-Control-Allow-Origin;
}
location ^~ /remotes/auth/ {
    set $remote_backend auth:8080;
