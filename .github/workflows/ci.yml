name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --include=dev
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:vercel
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  containers:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --include=dev
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:docker
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: docker-browser-report
          path: |
            playwright-report/docker/
            test-results/docker/
          retention-days: 7
